[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "race-photo-preprocessor"
version = "0.1.0"
description = "Desktop GUI for preprocessing race event photos before uploading to race-photo-store"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10.0",
    "paramiko>=3.4",
    "httpx>=0.27",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.scripts]
preprocessor = "preprocessor.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "numpy>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["preprocessor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
